services:
  deqing_serve:
    image: deqing_serve:1-12-5    # 请替换为实际的标签
    container_name: deqing_service
    restart: unless-stopped

    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: appuser
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run:size=64M,mode=1777
      - /app/tmp:size=32M,mode=1777
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default

    ports:
      - "9990:9997"

    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=WARN
      - SECURITY_MODE=ENABLED
      - LD_LIBRARY_PATH=/usr/local/lib:/usr/lib/x86_64-linux-gnu
      # ===== [配置生效] 告诉程序从这里读取高程 TIFF 文件 =====
      - ELEVATION_TIFF_PATH=/app/geo_data/local_mask.tif

    volumes:
      - ./deployment/config/config.json:/app/config.json:ro
      - ./deployment/config/region.json:/app/region.json:ro
      - ./deployment/logs:/app/logs:rw
      - ./deployment/data:/app/data:rw
      - ./deployment/uploads:/app/uploads:rw
      # ===== [修正位置] 将宿主机存放 TIFF 的目录挂载到容器内 =====
      # 必须放在服务的 volumes 列表下，使用 :ro 只读挂载确保数据安全
      - ./deployment/geo_data:/app/geo_data:ro

    networks:
      - deqing_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9997/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 网络配置
networks:
  deqing_network:
    driver: bridge

# 数据卷配置
volumes:
  postgres_data:
    driver: local
    # 注意：这里不能写主机的路径挂载映射，这里是定义 Docker 管理的 Volume